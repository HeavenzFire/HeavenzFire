<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none">
<title>HeavenzFire Desktop Browser</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#0b1020;color:#e6edf8}*{box-sizing:border-box}body{margin:0;overflow:hidden}
.chrome{height:106px;background:linear-gradient(120deg,#111a30,#101525 60%,#16223b);border-bottom:1px solid #2a3550;box-shadow:0 8px 26px #0004}
.top{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px}.brand{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:#dbeafe;white-space:nowrap}.mark{width:17px;height:17px;border:2px solid #60a5fa;border-radius:50%;box-shadow:inset 0 0 0 3px #14213c}.status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:#a7b7d4}.dot{width:7px;height:7px;border-radius:50%;background:#34d399}
.tabs{display:flex;height:31px;gap:4px;padding:0 9px;overflow-x:auto;align-items:end}.tab{max-width:210px;min-width:100px;height:27px;border:1px solid #2b3651;border-bottom:0;border-radius:8px 8px 0 0;background:#10172a;color:#91a1bd;display:flex;align-items:center;gap:8px;padding:0 10px;cursor:pointer;font-size:11px}.tab.active{background:#202b42;color:#f0f6ff;border-color:#455779}.tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.close{border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;padding:0}.newtab{width:28px;height:26px;border:1px solid #34425e;border-radius:7px;background:#17223a;color:#dbeafe;cursor:pointer;flex:none}
.nav{display:flex;align-items:center;gap:7px;padding:6px 12px 9px;height:39px}.navbtn{width:30px;height:29px;flex:none;border:1px solid #2d3955;border-radius:8px;background:#172139;color:#dce7f9;font-size:15px;cursor:pointer}.navbtn:disabled{opacity:.35;cursor:default}.address-wrap{display:flex;align-items:center;gap:8px;flex:1;height:30px;border:1px solid #354565;background:#0b1222;border-radius:9px;padding:0 10px;min-width:0}.lock{color:#6ee7b7;font-size:12px}#address{border:0;outline:0;background:transparent;color:#edf4ff;width:100%;min-width:0;font-size:12px}#address::placeholder{color:#64748b}.go{height:29px;padding:0 13px;border:1px solid #4b80c8;border-radius:8px;color:white;background:#2563eb;font-size:11px;font-weight:700;cursor:pointer}
.notice{position:fixed;left:12px;bottom:12px;z-index:9999;max-width:min(540px,calc(100vw - 24px));border:1px solid #475569;background:#101827f2;border-radius:10px;padding:11px 14px;color:#dbeafe;font-size:12px;box-shadow:0 10px 30px #0008;display:none}.notice.error{border-color:#b45353}.notice button{margin-left:12px;background:transparent;border:0;color:#93c5fd;cursor:pointer}.foot{position:fixed;bottom:0;right:0;z-index:1;padding:3px 9px;background:#101827d9;color:#8190aa;font-size:9px;pointer-events:none}
</style></head><body>
<header class="chrome"><div class="top"><div class="brand"><span class="mark"></span> HEAVENZFIRE <span style="color:#8294b5;font-weight:500">/ DESKTOP BROWSER</span></div><div class="status"><span class="dot"></span><span>Local Chromium session</span></div></div>
<div class="tabs" id="tabs" role="tablist" aria-label="Browser tabs"><button class="newtab" id="newTab" title="New tab" aria-label="New tab">+</button></div>
<form class="nav" id="navForm"><button class="navbtn" type="button" id="back" title="Back" aria-label="Back">←</button><button class="navbtn" type="button" id="forward" title="Forward" aria-label="Forward">→</button><button class="navbtn" type="button" id="reload" title="Reload" aria-label="Reload">↻</button><button class="navbtn" type="button" id="home" title="Home" aria-label="Home">⌂</button>
<div class="address-wrap"><span class="lock">●</span><input id="address" type="text" autocomplete="url" spellcheck="false" placeholder="Search or enter a website address" aria-label="Search or enter a website address"></div><button class="go" type="submit">GO</button></form></header>
<div class="notice" id="notice" role="status" aria-live="polite"></div><div class="foot">HTTPS supported · remote pages isolated from local app privileges</div><script src="./app.js"></script></body></html>
