<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unified Field Browser Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Unified Field</h1>
    <p class="hint">Capture selected text, review it, then send a pending proposal to your local inbox.</p>
    <button id="capture" type="button">Capture selected text</button>
    <label for="proposal">Proposal text</label>
    <textarea id="proposal" rows="9" maxlength="12000" placeholder="Capture text or write a proposal here. Nothing is sent until you submit."></textarea>
    <button id="submit" type="button">Submit pending proposal</button>
    <p id="status" role="status" aria-live="polite">Local inbox: 127.0.0.1:18796</p>
  </main>
  <script src="task-record.js"></script>
  <script src="popup.js"></script>
</body>
</html>
