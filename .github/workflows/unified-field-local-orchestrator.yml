name: Unified Field Local Orchestrator
on:
  push:
    paths:
      - 'UnifiedField/LocalOrchestrator/**'
      - '.github/workflows/unified-field-local-orchestrator.yml'
  pull_request:
    paths:
      - 'UnifiedField/LocalOrchestrator/**'
      - '.github/workflows/unified-field-local-orchestrator.yml'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check UnifiedField/LocalOrchestrator/orchestrator.cjs
      - run: node --test UnifiedField/LocalOrchestrator/orchestrator.test.cjs
