name: AGQI Mycelial Fabric
on:
  pull_request:
    paths:
      - 'UnifiedField/AGQI/**'
      - '.github/workflows/agqi-mycelial-fabric.yml'
  push:
    branches: [main]
    paths:
      - 'UnifiedField/AGQI/**'
      - '.github/workflows/agqi-mycelial-fabric.yml'
permissions:
  contents: read
jobs:
  mycelial-fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check UnifiedField/AGQI/mycelial-fabric.cjs
      - name: Unit tests
        run: node --test UnifiedField/AGQI/mycelial-fabric.test.cjs
