name: HeavenzFire GitHub Desktop Bridge

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Select a fixed, bounded operation on the registered Windows runner"
        required: true
        type: choice
        options:
          - connection_check
          - local_runtime_health
          - unified_field_tests
        default: connection_check

permissions:
  contents: read

concurrency:
  group: heavenzfire-desktop-bridge
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: [self-hosted, Windows, X64, heavenzfire-desktop]
    timeout-minutes: 10
    steps:
      - name: Checkout selected repository revision without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run bounded bridge operation and validate protocol handshake
        shell: powershell
        env:
          HF_OPERATION: ${{ inputs.operation }}
          HF_REPOSITORY: ${{ github.repository }}
          HF_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw "Expected Windows runner; got '$env:RUNNER_OS'." }
          $nonce = [Guid]::NewGuid().ToString('N')
          $output = & .\UnifiedField\QuantumLab\heavenzfire-desktop-bridge.ps1 -Operation $env:HF_OPERATION -SessionNonce $nonce 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Bridge operation failed with exit code $LASTEXITCODE. Output follows: $($output -join [Environment]::NewLine)" }
          if ($env:HF_OPERATION -eq 'unified_field_tests') {
            Write-Output ($output -join [Environment]::NewLine)
          } else {
            $reportText = ($output -join [Environment]::NewLine)
            try { $report = $reportText | ConvertFrom-Json } catch { throw 'Bridge returned invalid JSON.' }
            if ($report.protocol_version -ne 'heavenzfire.desktop-bridge.v1') { throw 'Protocol version mismatch.' }
            if ($report.session_nonce -ne $nonce -or $report.nonce_echo -ne $nonce) { throw 'Handshake nonce mismatch.' }
            if ($report.operation -ne $env:HF_OPERATION) { throw 'Operation mismatch.' }
            if ($report.repository -ne $env:HF_REPOSITORY -or $report.revision -ne $env:HF_REVISION) { throw 'Repository/revision identity mismatch.' }
            Write-Output 'HF_HANDSHAKE=VALID'
            $report | ConvertTo-Json -Depth 8 -Compress | Write-Output
            if ($report.status -eq 'DEGRADED') { Write-Warning 'Bridge responded, but one or more local probes are degraded. See structured results.' }
          }

      - name: Record completion boundary
        if: always()
        shell: powershell
        run: |
          Write-Output ("HF_JOB_CONCLUSION=" + '${{ job.status }}')
          Write-Output 'A successful job proves only the selected bounded operation ran on this registered runner; it does not establish interactive desktop streaming.'