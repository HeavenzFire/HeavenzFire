name: Unified Field task inbox

on:
  push:
    branches:
      - main
      - feat/shared-task-contract-v1
      - 'worker/**'
  pull_request:
    branches:
      - main
      - feat/shared-task-contract-v1

jobs:
  task-inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Unified Field core
        uses: actions/checkout@v4
      - name: Check out UnifiedCodebase adapter
        uses: actions/checkout@v4
        with:
          repository: HeavenzFire/UnifiedCodebase
          ref: feat/unified-field-provider-core
          path: UnifiedCodebase
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check bridge and provenance adapter syntax
        run: |
          node --check UnifiedField/BrowserBridge/task-record.js
          node --check UnifiedField/BrowserBridge/popup.js
          node --check UnifiedField/FieldCore/evidence-ledger.cjs
          node --check UnifiedField/FieldCore/public-record-adapter.cjs
          node --check UnifiedField/FieldCore/capability-registry-validator.cjs
      - name: Test task contract, inbox, browser bridge, evidence ledger, public-record adapter, and cross-repository transport
        env:
          HF_HUB_ADAPTER_PATH: ${{ github.workspace }}/UnifiedCodebase/integrations/shared-task-proposal-adapter.mjs
        run: node --test UnifiedField/FieldCore/shared-task-contract.test.cjs UnifiedField/FieldCore/task-inbox-server.test.cjs UnifiedField/BrowserBridge/browser-bridge.test.cjs UnifiedField/FieldCore/evidence-ledger.test.cjs UnifiedField/FieldCore/public-record-adapter.test.cjs UnifiedField/FieldCore/cross-repo-task-transport.test.cjs UnifiedField/FieldCore/capability-registry-validator.test.cjs UnifiedField/FieldCore/capability-registry-integration.test.cjs
