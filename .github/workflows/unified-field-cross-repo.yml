name: Unified Field task inbox

on:
  push:
    branches:
      - main
      - feat/shared-task-contract-v1
  pull_request:
    branches:
      - main

jobs:
  task-inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Unified Field core
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test core contract and persistent inbox
        run: node --test UnifiedField/FieldCore/shared-task-contract.test.cjs UnifiedField/FieldCore/task-inbox-server.test.cjs
