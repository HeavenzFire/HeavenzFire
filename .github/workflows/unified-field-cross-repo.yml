name: Unified Field cross-repository task integration

on:
  push:
    branches:
      - main
      - feat/shared-task-contract-v1
  pull_request:
    branches:
      - main

jobs:
  cross-repository-task:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Unified Field core
        uses: actions/checkout@v4
      - name: Check out OpenSourceAIHub adapter
        uses: actions/checkout@v4
        with:
          repository: HeavenzFire/OpenSourceAIHub
          ref: feat/unified-field-task-contract-adapter
          path: OpenSourceAIHub
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test core contract and inbox
        run: node --test UnifiedField/FieldCore/shared-task-contract.test.cjs UnifiedField/FieldCore/task-inbox-server.test.cjs
      - name: Test cross-repository proposal transport
        env:
          HF_HUB_ADAPTER_PATH: ${{ github.workspace }}/OpenSourceAIHub/unified-field-task-transport.cjs
        run: node --test UnifiedField/FieldCore/cross-repo-task-transport.test.cjs
