name: Unified Field Ternary Policy Tests

on:
  push:
    branches: [main]
    paths:
      - 'UnifiedField/QuantumLab/uf-tcp-policy.cjs'
      - 'UnifiedField/QuantumLab/uf-tcp-policy.test.cjs'
      - 'UnifiedField/QuantumLab/uf-144-council.cjs'
      - 'UnifiedField/QuantumLab/uf-144-council.test.cjs'
      - 'UnifiedField/QuantumLab/uf-bridge-journal.cjs'
      - 'UnifiedField/QuantumLab/uf-bridge-journal.test.cjs'
      - 'UnifiedField/QuantumLab/uf-topology.cjs'
      - 'UnifiedField/QuantumLab/uf-topology.test.cjs'
      - 'UnifiedField/QuantumLab/uf-topology-cli.cjs'
      - 'UnifiedField/QuantumLab/uf-topology-cli.test.cjs UnifiedField/QuantumLab/uf-local-worker.test.cjs'
      - 'UnifiedField/QuantumLab/uf-local-worker.cjs'
      - 'UnifiedField/QuantumLab/uf-local-worker.test.cjs'
      - 'UnifiedField/QuantumLab/Start-UnifiedFieldWorker.ps1'
      - '.github/workflows/uf-tcp-policy.yml'
  pull_request:
    paths:
      - 'UnifiedField/QuantumLab/uf-tcp-policy.cjs'
      - 'UnifiedField/QuantumLab/uf-tcp-policy.test.cjs'
      - 'UnifiedField/QuantumLab/uf-144-council.cjs'
      - 'UnifiedField/QuantumLab/uf-144-council.test.cjs'
      - 'UnifiedField/QuantumLab/uf-bridge-journal.cjs'
      - 'UnifiedField/QuantumLab/uf-bridge-journal.test.cjs'
      - 'UnifiedField/QuantumLab/uf-topology.cjs'
      - 'UnifiedField/QuantumLab/uf-topology.test.cjs'
      - 'UnifiedField/QuantumLab/uf-topology-cli.cjs'
      - 'UnifiedField/QuantumLab/uf-topology-cli.test.cjs'
      - '.github/workflows/uf-tcp-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic policy tests
        run: node --test UnifiedField/QuantumLab/uf-tcp-policy.test.cjs UnifiedField/QuantumLab/uf-144-council.test.cjs UnifiedField/QuantumLab/uf-bridge-journal.test.cjs UnifiedField/QuantumLab/uf-topology.test.cjs UnifiedField/QuantumLab/uf-topology-cli.test.cjs
