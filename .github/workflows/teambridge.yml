name: HeavenzFire TeamBridge
on:
  pull_request:
    paths:
      - 'UnifiedField/TeamBridge/**'
      - 'UnifiedField/PropagationFabric/fabric-envelope.cjs'
      - '.github/workflows/teambridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teambridge-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check TeamBridge modules
        run: |
          node --check UnifiedField/TeamBridge/team-ledger.cjs
          node --check UnifiedField/TeamBridge/team-dispatcher.cjs
          node --check UnifiedField/TeamBridge/record-provider-probe.cjs
      - name: Run TeamBridge and PropagationFabric tests
        run: |
          node --test UnifiedField/TeamBridge/team-ledger.test.cjs UnifiedField/TeamBridge/team-dispatcher.test.cjs UnifiedField/PropagationFabric/fabric-envelope.test.cjs
