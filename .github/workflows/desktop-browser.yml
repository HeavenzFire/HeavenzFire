name: Desktop Browser CI
on:
  pull_request:
    paths:
      - "desktop-browser/**"
      - ".github/workflows/desktop-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-browser/package.json
      - name: Install dependencies
        working-directory: desktop-browser
        run: npm install
      - name: Validate JavaScript syntax
        working-directory: desktop-browser
        run: npm test
      - name: Build Windows installer
        working-directory: desktop-browser
        run: npm run dist
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: heavenzfire-desktop-browser-windows
          path: desktop-browser/release/*.exe
          if-no-files-found: error
