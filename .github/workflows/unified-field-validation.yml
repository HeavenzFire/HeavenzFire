name: Unified Field validation

on:
  pull_request:
    paths:
      - "UNIFIED-FIELD-ANTI-EXTRACTION.md"
      - "schemas/**"
      - "registry/**"
      - "tools/validate_registry.py"
      - "tests/test_validate_registry.py"
      - ".github/workflows/unified-field-validation.yml"
  push:
    branches: ["main"]
    paths:
      - "UNIFIED-FIELD-ANTI-EXTRACTION.md"
      - "schemas/**"
      - "registry/**"
      - "tools/validate_registry.py"
      - "tests/test_validate_registry.py"
      - ".github/workflows/unified-field-validation.yml"

permissions:
  contents: read

jobs:
  registry-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate capability registry
        run: python tools/validate_registry.py registry/capabilities.json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
