name: Unified Field dashboard and local worker checks

on:
  push:
    branches: ["main", "feat/unified-field-local-model-workers"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  dashboard-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check dashboard and publisher syntax
        run: |
          node --check UnifiedField/QuantumLab/UnifiedField-Dashboard-Server.cjs
          node --check UnifiedField/QuantumLab/uf-model-worker-journal-publisher.cjs
          node --check UnifiedField/QuantumLab/worker-forge.cjs
      - name: Parse worker and validator PowerShell without executing generated code
        shell: pwsh
        run: |
          $paths = @(
            "${{ github.workspace }}/UnifiedField/QuantumLab/Invoke-LocalModelWorkerBatch.ps1",
            "${{ github.workspace }}/UnifiedField/QuantumLab/Test-LocalModelWorkerResponse.ps1",
            "${{ github.workspace }}/UnifiedField/QuantumLab/Test-LocalModelWorkerResponse.Tests.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
          & "${{ github.workspace }}/UnifiedField/QuantumLab/Test-LocalModelWorkerResponse.Tests.ps1"
      - name: Test dashboard-worker safety contract and deterministic worker forge
        run: node --test UnifiedField/QuantumLab/unified-field-dashboard.test.cjs UnifiedField/QuantumLab/uf-model-worker-journal-publisher.test.cjs UnifiedField/QuantumLab/worker-forge.test.cjs
