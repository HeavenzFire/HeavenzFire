name: Unified Field dashboard and local worker checks

on:
  push:
    branches: ["main", "feat/unified-field-local-model-workers"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  dashboard-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check dashboard and publisher syntax
        run: |
          node --check UnifiedField/QuantumLab/UnifiedField-Dashboard-Server.cjs
          node --check UnifiedField/QuantumLab/uf-model-worker-journal-publisher.cjs
      - name: Parse worker PowerShell without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("${{ github.workspace }}/UnifiedField/QuantumLab/Invoke-LocalModelWorkerBatch.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Test dashboard-worker safety contract and dashboard script syntax
        run: node --test UnifiedField/QuantumLab/unified-field-dashboard.test.cjs UnifiedField/QuantumLab/uf-model-worker-journal-publisher.test.cjs
