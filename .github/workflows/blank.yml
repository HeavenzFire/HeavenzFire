name: Unified Field dashboard and local worker checks

on:
  push:
    branches: ["main", "feat/unified-field-local-model-workers"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  dashboard-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check dashboard server syntax
        run: node --check UnifiedField/QuantumLab/UnifiedField-Dashboard-Server.cjs
      - name: Test dashboard-worker safety contract and dashboard script syntax
        run: node --test UnifiedField/QuantumLab/unified-field-dashboard.test.cjs
