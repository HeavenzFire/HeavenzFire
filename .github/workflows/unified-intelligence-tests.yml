name: Unified Intelligence tests

on:
  push:
    branches:
      - main
      - fix/historical-profile-deterministic-runtime
    paths:
      - "UnifiedField/QuantumLab/historical-profile-runtime.cjs"
      - "UnifiedField/QuantumLab/historical-profile-runtime.test.cjs"
      - "UnifiedField/QuantumLab/HeavenzFire-Unified-Intelligence-Server.cjs"
      - "UnifiedField/QuantumLab/HeavenzFire-Unified-Intelligence-Server.test.cjs"
      - "UnifiedField/QuantumLab/micro-mind-unified-client.cjs"
      - "UnifiedField/QuantumLab/micro-mind-unified-client.test.cjs"
      - "UnifiedField/QuantumLab/MicroMind-Unified-Intelligence.html"
      - "UnifiedField/QuantumLab/Start-HeavenzFireUnifiedIntelligence.ps1"
      - ".github/workflows/unified-intelligence-tests.yml"
  pull_request:
    paths:
      - "UnifiedField/QuantumLab/historical-profile-runtime.cjs"
      - "UnifiedField/QuantumLab/historical-profile-runtime.test.cjs"
      - "UnifiedField/QuantumLab/HeavenzFire-Unified-Intelligence-Server.cjs"
      - "UnifiedField/QuantumLab/HeavenzFire-Unified-Intelligence-Server.test.cjs"
      - "UnifiedField/QuantumLab/micro-mind-unified-client.cjs"
      - "UnifiedField/QuantumLab/micro-mind-unified-client.test.cjs"
      - "UnifiedField/QuantumLab/MicroMind-Unified-Intelligence.html"
      - "UnifiedField/QuantumLab/Start-HeavenzFireUnifiedIntelligence.ps1"
      - ".github/workflows/unified-intelligence-tests.yml"

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unified runtime and browser-client tests
        run: node --test UnifiedField/QuantumLab/historical-profile-runtime.test.cjs UnifiedField/QuantumLab/HeavenzFire-Unified-Intelligence-Server.test.cjs UnifiedField/QuantumLab/micro-mind-unified-client.test.cjs
