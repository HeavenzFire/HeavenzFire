name: Termux preflight shell validation

on:
  pull_request:
    paths:
      - "tools/termux_preflight.sh"
      - ".github/workflows/termux-preflight.yml"
  push:
    branches: [main]
    paths:
      - "tools/termux_preflight.sh"
      - ".github/workflows/termux-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n tools/termux_preflight.sh
      - name: Verify curl isolation regression guard
        run: bash tests/test_termux_preflight.sh
