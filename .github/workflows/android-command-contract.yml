name: Android command contract tests

on:
  pull_request:
    paths:
      - 'tools/mobile_command_contract.py'
      - 'tests/test_mobile_command_contract.py'
      - 'docs/android-command-contract-v0.1.md'
      - '.github/workflows/android-command-contract.yml'
  push:
    branches: [main, 'feat/android-command-contract-v0.1']
    paths:
      - 'tools/mobile_command_contract.py'
      - 'tests/test_mobile_command_contract.py'
      - 'docs/android-command-contract-v0.1.md'
      - '.github/workflows/android-command-contract.yml'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Android command contract tests
        run: python -m unittest tests.test_mobile_command_contract -v
