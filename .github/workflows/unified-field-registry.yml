name: Unified Field Capability Registry
on:
  push:
    branches: ["main", "unified-field/**"]
    paths:
      - "tools/validate_capabilities.py"
      - "tests/test_validate_capabilities.py"
      - "examples/capability-registry.json"
      - ".github/workflows/unified-field-registry.yml"
  pull_request:
    paths:
      - "tools/validate_capabilities.py"
      - "tests/test_validate_capabilities.py"
      - "examples/capability-registry.json"
      - ".github/workflows/unified-field-registry.yml"
jobs:
  validate-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator tests
        run: python -m unittest tests.test_validate_capabilities -v
      - name: Validate example registry
        run: python tools/validate_capabilities.py examples/capability-registry.json
