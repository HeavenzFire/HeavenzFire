name: Unified Operator tests

on:
  push:
    paths:
      - "projects/HeavenzFire-Unified-Operator/**"
  pull_request:
    paths:
      - "projects/HeavenzFire-Unified-Operator/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/HeavenzFire-Unified-Operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
