name: Sentinel policy tests

on:
  push:
    branches: [main, 'feature/sentinel-*']
    paths:
      - 'UnifiedField/Sentinel/**'
      - '.github/workflows/sentinel-policy.yml'
  pull_request:
    paths:
      - 'UnifiedField/Sentinel/**'
      - '.github/workflows/sentinel-policy.yml'

permissions:
  contents: read

jobs:
  scope-policy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check
        run: node --check UnifiedField/Sentinel/scope-policy.cjs
      - name: Policy tests
        run: node --test UnifiedField/Sentinel/scope-policy.test.cjs UnifiedField/Sentinel/passive-assessment.test.cjs
      - name: Manifest integrity
        run: |
          node -e "const m=require('./UnifiedField/Sentinel/sentinel-agent-manifest.json'); if(m.schemaVersion!==1||m.agents.length!==16||new Set(m.agents.map(a=>a.id)).size!==16) process.exit(1); console.log('16 unique logical Sentinel roles verified; maxParallel='+m.maxParallel)"
