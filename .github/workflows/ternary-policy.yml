name: Unified Field Ternary Policy

on:
  pull_request:
    paths:
      - "UnifiedField/FieldCore/ternary-policy-engine.cjs"
      - "UnifiedField/FieldCore/ternary-policy-engine.test.cjs"
      - ".github/workflows/ternary-policy.yml"
  push:
    branches: [main]
    paths:
      - "UnifiedField/FieldCore/ternary-policy-engine.cjs"
      - "UnifiedField/FieldCore/ternary-policy-engine.test.cjs"
      - ".github/workflows/ternary-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ternary-policy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The repository currently contains a gitlink without a matching .gitmodules
      # entry. actions/checkout's post-job submodule cleanup fails on that state.
      # Fetch only the event ref here; keep the read-only token scoped to this step
      # and do not persist it in Git configuration or expose it to tests.
      - name: Fetch source without submodule cleanup hooks
        env:
          GH_TOKEN: ${{ github.token }}
          FETCH_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          ASKPASS="$RUNNER_TEMP/git-askpass.sh"
          trap 'rm -f "$ASKPASS"' EXIT
          cat > "$ASKPASS" <<'ASKPASS_SCRIPT'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS_SCRIPT
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          git fetch --depth=1 origin "$FETCH_REF"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Syntax-check policy engine
        run: node --check UnifiedField/FieldCore/ternary-policy-engine.cjs
      - name: Run ternary policy acceptance tests
        run: node --test UnifiedField/FieldCore/ternary-policy-engine.test.cjs
