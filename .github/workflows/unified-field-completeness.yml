name: Unified Field Completeness Registry

on:
  pull_request:
    paths:
      - 'UnifiedField/QuantumLab/unified-field-completeness.json'
      - 'UnifiedField/QuantumLab/uf-completeness-registry.cjs'
      - 'UnifiedField/QuantumLab/uf-completeness-registry.test.cjs'
      - '.github/workflows/unified-field-completeness.yml'
  push:
    branches: [main]
    paths:
      - 'UnifiedField/QuantumLab/unified-field-completeness.json'
      - 'UnifiedField/QuantumLab/uf-completeness-registry.cjs'
      - 'UnifiedField/QuantumLab/uf-completeness-registry.test.cjs'
      - '.github/workflows/unified-field-completeness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completeness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch source without checkout credentials or submodule hooks
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-recurse-submodules --depth=1 origin "${REVISION}"
          git checkout --detach FETCH_HEAD
      - name: Assert no local Git authentication is configured
        run: |
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "::error::Unexpected Git authentication persisted in local config"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate capability registry
        run: node UnifiedField/QuantumLab/uf-completeness-registry.cjs
      - name: Test registry enforcement
        run: node --test UnifiedField/QuantumLab/uf-completeness-registry.test.cjs
